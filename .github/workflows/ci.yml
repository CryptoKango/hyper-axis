name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [master, main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo clippy -p hyper-axis-wasm --target wasm32-unknown-unknown -- -D warnings

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-linux.sh dist/linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: hyper-axis-linux-x86_64
          path: dist/linux-x86_64

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: scripts/build-wasm.sh dist/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: hyper-axis-wasm
          path: dist/wasm

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - run: scripts/build-android.sh dist/android
      - uses: actions/upload-artifact@v4
        with:
          name: hyper-axis-android
          path: dist/android

  build-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-apple.sh dist/apple
      - uses: actions/upload-artifact@v4
        with:
          name: hyper-axis-apple
          path: dist/apple
